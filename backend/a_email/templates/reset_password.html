<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Redefinição de senha</title>
    </head>
    <body style="font-family: Arial, sans-serif">
        <h2>Olá, {{ user.first_name|default:user.username }}</h2>

        <p style="padding-bottom: 5px;">
            Sua conta foi criada com sucesso. Para definir sua senha, clique no
            botão abaixo:
        </p>

        <p>
            <a
                href="{{ reset_link }}"
                style="
                    background-color: #4f46e5;
                    color: white;
                    padding: 12px 20px;
                    text-decoration: none;
                    border-radius: 6px;
                "
            >
                Criar nova senha
            </a>
        </p>

        <p style="padding-top: 5px;">Se você não solicitou este acesso, ignore este email.</p>

        <br />
        <small>Equipe de Suporte</small>
    </body>
</html>
